<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 900"
     preserveAspectRatio="xMidYMid slice">

  <defs>

    <!-- שמיים -->
    <linearGradient
      id="sky"
      x1="0"
      y1="0"
      x2="0"
      y2="1">

      <stop offset="0%" stop-color="#062b38"/>
      <stop offset="45%" stop-color="#087487"/>
      <stop offset="100%" stop-color="#65dce5"/>

    </linearGradient>


    <!-- הרים רחוקים -->
    <linearGradient
      id="farMountains"
      x1="0"
      y1="0"
      x2="1"
      y2="1">

      <stop offset="0%" stop-color="#438f98"/>
      <stop offset="100%" stop-color="#175864"/>

    </linearGradient>


    <!-- הרים קדמיים -->
    <linearGradient
      id="mountains"
      x1="0"
      y1="0"
      x2="1"
      y2="1">

      <stop offset="0%" stop-color="#1c5965"/>
      <stop offset="100%" stop-color="#062e39"/>

    </linearGradient>


    <!-- קרקע -->
    <linearGradient
      id="ground"
      x1="0"
      y1="0"
      x2="0"
      y2="1">

      <stop offset="0%" stop-color="#24766e"/>
      <stop offset="100%" stop-color="#062f34"/>

    </linearGradient>


    <!-- שמש -->
    <radialGradient id="sun">

      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#d8ffff"/>
      <stop offset="100%" stop-color="#71e0e6"/>

    </radialGradient>


    <!-- זוהר -->
    <filter id="blur">

      <feGaussianBlur stdDeviation="30"/>

    </filter>

  </defs>


  <!-- =========================
       SKY
  ========================== -->

  <rect
    width="1600"
    height="900"
    fill="url(#sky)"
  />


  <!-- =========================
       SUN GLOW
  ========================== -->

  <circle
    cx="1250"
    cy="180"
    r="230"
    fill="#7ce8ed"
    opacity="0.08"
    filter="url(#blur)"
  />


  <circle
    cx="1250"
    cy="180"
    r="110"
    fill="url(#sun)"
    opacity="0.9"
  />


  <!-- =========================
       DISTANT MOUNTAINS
  ========================== -->

  <path
    d="
      M0 600
      L180 410
      L330 545
      L520 300
      L730 570
      L950 350
      L1160 560
      L1370 380
      L1600 570
      L1600 900
      L0 900
      Z
    "
    fill="url(#farMountains)"
    opacity="0.8"
  />


  <!-- =========================
       MAIN MOUNTAINS
  ========================== -->

  <path
    d="
      M0 700
      L260 390
      L420 565
      L650 230
      L900 610
      L1120 340
      L1390 620
      L1600 440
      L1600 900
      L0 900
      Z
    "
    fill="url(#mountains)"
  />


  <!-- =========================
       SNOW
  ========================== -->

  <path
    d="
      M650 230
      L565 365
      L620 335
      L650 385
      L685 340
      L730 395
      L900 610
      Z
    "
    fill="#dfffff"
    opacity="0.65"
  />


  <path
    d="
      M1120 340
      L1045 450
      L1090 425
      L1120 470
      L1155 430
      L1210 485
      Z
    "
    fill="#dfffff"
    opacity="0.5"
  />


  <!-- =========================
       FOREGROUND
  ========================== -->

  <path
    d="
      M0 720
      C250 650 430 730 650 690
      C850 650 1020 740 1250 680
      C1400 640 1510 680 1600 650
      L1600 900
      L0 900
      Z
    "
    fill="url(#ground)"
  />


  <!-- =========================
       WALKING TRAIL
  ========================== -->

  <path
    d="
      M800 900
      C830 820
      850 760
      820 700
      C790 645
      760 610
      790 565
    "
    fill="none"
    stroke="#dfffff"
    stroke-width="20"
    stroke-linecap="round"
    opacity="0.7"
  />


  <!-- =========================
       TRAIL POINTS
  ========================== -->

  <circle
    cx="790"
    cy="565"
    r="11"
    fill="#77fd68"
  />

  <circle
    cx="820"
    cy="700"
    r="11"
    fill="#77fd68"
  />

  <circle
    cx="800"
    cy="820"
    r="11"
    fill="#77fd68"
  />


  <!-- =========================
       DARK OVERLAY
  ========================== -->

  <rect
    width="1600"
    height="900"
    fill="#022832"
    opacity="0.22"
  />

</svg>