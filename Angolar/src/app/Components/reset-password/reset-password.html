
<div class="reset-password-page" dir="rtl">

  <!-- שכבת רקע -->

  <div class="page-overlay"></div>

  <!-- כפתור חזרה -->

  <button type="button" class="back-button" routerLink="/">
    <span class="back-arrow">→</span>
    חזרה
  </button>

  <div class="reset-container">

<!-- כותרת -->
<div class="reset-header">
  <div class="reset-icon">
    🔐
  </div>

  <h1>איפוס סיסמה</h1>

  <p>
    הזינו את הפרטים שלכם כדי להמשיך
    ולבחור סיסמה חדשה
  </p>
</div>

<!-- טופס -->
<form [formGroup]="PasswordForm" (ngSubmit)="openDialog()">

  <!-- שם משתמש -->
  <div class="form-group">
    <label for="UserName">שם משתמש</label>

    <div class="input-wrapper">
      <span class="input-icon">👤</span>

      <input
        id="UserName"
        type="text"
        formControlName="UserName"
        placeholder="הכניסו שם משתמש"
      />
    </div>
  </div>

  <!-- אימייל -->
  <div class="form-group">
    <label for="Email">אימייל</label>

    <div class="input-wrapper">
      <span class="input-icon">✉</span>

      <input
        id="Email"
        type="email"
        formControlName="Email"
        placeholder="הכניסו כתובת אימייל"
      />
    </div>
  </div>

  <!-- טלפון -->
  <div class="form-group">
    <label for="Phon">טלפון</label>

    <div class="input-wrapper">
      <span class="input-icon">☎</span>

      <input
        id="Phon"
        type="tel"
        formControlName="Phon"
        placeholder="הכניסו מספר טלפון"
      />
    </div>
  </div>

  <!-- כפתור -->
  <button
    type="submit"
    class="reset-button"
    [disabled]="PasswordForm.invalid">
    בחירת סיסמה חדשה
    <span class="button-arrow">←</span>
  </button>

</form>

<div class="reset-footer">
  <span>🔒</span>
  הפרטים שלכם נשמרים באופן מאובטח
</div>

  </div>

</div>
