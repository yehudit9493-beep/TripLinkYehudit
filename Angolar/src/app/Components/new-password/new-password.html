<div class="new-password-dialog" dir="rtl">

  <!-- כותרת -->

  <div class="dialog-header">


<div class="password-icon">
  🔐
</div>

<h2>בחירת סיסמה חדשה</h2>

<p>
  הגדירו סיסמה חדשה וחזקה לחשבון שלכם
</p>


  </div>

  <!-- תוכן -->

  <div class="dialog-content">

<!-- סיסמה חדשה -->
<div class="password-field">

  <label for="newPassword">
    סיסמה חדשה
  </label>

  <div class="input-wrapper">

    <span class="input-icon">🔒</span>

    <input
      id="newPassword"
      [type]="showPassword ? 'text' : 'password'"
      [(ngModel)]="password"
      placeholder="הכניסו סיסמה חזקה">

    <button
      type="button"
      class="eye-button"
      (click)="showPassword = !showPassword">

      <i
        [class]="showPassword
          ? 'bi bi-eye'
          : 'bi bi-eye-slash'">
      </i>

    </button>

  </div>

</div>


<!-- אימות סיסמה -->
<div class="password-field">

  <label for="confirmPassword">
    אימות סיסמה
  </label>

  <div class="input-wrapper">

    <span class="input-icon">✓</span>

    <input
      id="confirmPassword"
      [type]="showConfirmPassword ? 'text' : 'password'"
      [(ngModel)]="confirmPassword"
      placeholder="הכניסו שוב את הסיסמה">

    <button
      type="button"
      class="eye-button"
      (click)="showConfirmPassword = !showConfirmPassword">

      <i
        [class]="showConfirmPassword
          ? 'bi bi-eye'
          : 'bi bi-eye-slash'">
      </i>

    </button>

  </div>

</div>


<!-- דרישות סיסמה -->
<div class="password-hint">

  <span class="hint-icon">i</span>

  <span>
    הסיסמה צריכה להכיל לפחות 8 תווים,
    אות גדולה, אות קטנה, מספר ותו מיוחד.
  </span>

</div>


  </div>

  <!-- כפתורים -->

  <div class="dialog-actions">


<button
  type="button"
  class="cancel-button"
  (click)="onNoClick()">

  ביטול

</button>

<button
  type="button"
  class="confirm-button"
 [disabled]="!password() || password() !== confirmPassword"
  [mat-dialog-close]="password">

  שמירת סיסמה

  <span>←</span>

</button>


  </div>

</div>
